# ---------- Email digest (optional) -----------------------------------------
email:
  enabled: false
  from: "you@example.com"
  to: ["you@example.com"]
  subject: "HEP jobs digest"
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
  # smtp_user / smtp_password better set via env: SMTP_USER, SMTP_PASSWORD
