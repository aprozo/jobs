# config.yaml — committed working config for the GitHub Actions run.
# Local tweaks: edit and push. To experiment, copy this to a private fork.

# ---------- Job sources -----------------------------------------------------
sources:
  - type: inspire
    name: INSPIRE-HEP
    filters:
      status: open
      rank: [JUNIOR, POSTDOC]
      field_of_interest: [hep-ex, hep-ph]
      sort: mostrecent

  - type: ajo
    name: AcademicJobsOnline (HEP)
    sections: [HEP, HET]
    fetch_descriptions: false

  - type: cern
    name: CERN Careers
    fetch_descriptions: true       # adds ~1 detail call per posting (~60 total)
    only_research: false           # set true to skip non-research roles

  # - type: euraxess
  #   name: EURAXESS (Physics)
  #   domains: [Physics]
  #   keywords: ""
  #   max_pages: 5
  #   fetch_descriptions: false

  - type: desy
    name: DESY (Hamburg/Zeuthen)
    fetch_descriptions: false        # set true for richer detail (~30 detail calls)

  - type: gsi
    name: GSI / FAIR (Darmstadt)
    fetch_descriptions: false

  - type: rss
    name: ATLAS jobs
    url: https://atlas.cern/jobs/feed.xml
    key: atlas
    default_field: hep-ex

  # BNL careers — Workday CXS. Site slug is literally "Externa" (not
  # "External"). Filter by the "Postdoctoral Research" job-family-group.
  - type: workday
    name: BNL
    tenant: bnl
    site_id: Externa
    search_text: ""
    country: US
    institution: BNL
    fetch_descriptions: true
    default_field: hep-ex
    applied_facets:
      jobFamilyGroup: [b62af75407911009790a8c820a260002]

# ---------- Scoring ---------------------------------------------------------
scoring:
  preferred_countries: [US, DE, CH, NL, GB, FR, JP, KR]

  min_affordability_ratio: 1.5
  min_salary_ppp_usd: 65000

  preferred_experiments:
    - STAR
    - sPHENIX
    - ATLAS
    - CMS
    - LHCb
    - ALICE
    - EIC
    - ePIC
    - Belle II
  keywords_must_have:
    - jet
    - QCD
    - heavy ion
    - flavor
    - parton
    - calorimeter
    - trigger
    - tracking
  keywords_avoid:
    - dark matter direct detection
    - neutrino oscillation
    - gravitational wave

  min_report_score: 40

  weight_preferred_country: 15
  weight_good_salary: 15
  weight_keyword_match: 10
  weight_keyword_avoid: 10
  weight_preferred_experiment: 10

# ---------- LLM enrichment ---------------------------------------------------
# Active provider: 'manual'. Reads pre-computed per-job extractions from
# manual_enrichments.json (one-time bulk seeding). To switch to a live LLM
# for newly-discovered jobs, change `provider:` to one of: openrouter, gemini.
llm:
  provider: manual
  path: manual_enrichments.json

# OpenRouter (free models — https://openrouter.ai/models?max_price=0):
#   provider: openrouter
#   model: deepseek/deepseek-chat-v3.1:free
#   min_interval_s: 3.5             # env var: OPENROUTER_API_KEY
#
# Gemini (free tier; gemini-2.5-flash = 10 RPM):
#   provider: gemini
#   model: gemini-2.5-flash
#   min_interval_s: 6.5             # env var: GEMINI_API_KEY

# ---------- Email subscribe + digest ----------------------------------------
# Two channels:
#  - Formspree subscribe form on the page → forwards subscriber's email to you.
#  - Workflow can mail a digest to addresses listed in subscribers.yaml (TODO).
email:
  enabled: false
  subscribe_url: "https://formspree.io/f/xpqnweqv"  # Formspree endpoint
